# Charakter-Config: Marin Kitagawa (Phase 1 Trainings-Dummy)

character:
  name: "kitagawa_marin"
  booru_tag: "kitagawa_marin"
  source: "danbooru"

collection:
  # Started with all 4 ratings; kitagawa_marin skews ~36% questionable/explicit,
  # more than wanted. general+sensitive alone is ~4079 raw posts (before the
  # filters below) -- add "questionable" here if that's not enough after
  # curation, before reaching for "explicit".
  ratings: ["general", "sensitive"]
  min_short_side: 768
  exclude_tags: ["photo", "cosplay", "real"]
  max_character_count: 1 # nur Einzel-Charakter-Bilder in Phase 1

captioning:
  leading_tag: "kitagawa_marin"
  tag_dropout_prob: 0.1

training:
  resolution_area: 1048576 # ~1024x1024
  rank: 16
  alpha: 16
  learning_rate: 1.0e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  weighting_scheme: "logit_normal"
  checkpoint_every_steps: 250
  drive_checkpoint_dir: "/content/drive/MyDrive/charlora/outputs/marin_kitagawa"

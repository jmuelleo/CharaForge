# Charakter-Config: Frieren -- NSFW-Topup (questionable+explicit only)
#
# Same booru_tag/output folder as configs/frieren.yaml (data/raw/frieren/),
# just with the rating filter flipped to the two ratings that config
# excludes. Existing general/sensitive images are untouched: this run's
# rating filter rejects them before a download is even attempted, and
# collect_character() is idempotent by post id regardless.

character:
  name: "frieren"
  booru_tag: "frieren"
  source: "danbooru"

collection:
  ratings: ["questionable", "explicit"]
  min_short_side: 768
  exclude_tags: ["photo", "cosplay", "real"]
  max_character_count: 1

captioning:
  leading_tag: "frieren"
  tag_dropout_prob: 0.1

training:
  resolution_area: 1048576 # ~1024x1024
  rank: 16
  alpha: 16
  learning_rate: 1.0e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  weighting_scheme: "logit_normal"
  checkpoint_every_steps: 250
  drive_checkpoint_dir: "/content/drive/MyDrive/charlora/outputs/frieren"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charlora"
version = "0.1.0"
description = "Character LoRA fine-tuning on Chroma1-HD (flow matching, anime)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "diffusers>=0.31",
    "transformers>=4.45",
    "accelerate>=0.34",
    "bitsandbytes>=0.44",
    "safetensors>=0.4",
    "pillow>=10.0",
    "requests>=2.31",
    "imagehash>=4.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "sentencepiece>=0.2",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
